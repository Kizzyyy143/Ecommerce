
    <!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ទំព័រដើម | Home</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Kantumruy Pro & Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Kantumruy+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Kantumruy Pro', 'Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- Top Announcement Bar -->
    <div class="bg-brand-600 text-white text-xs md:text-sm py-2 px-4 text-center font-medium">
        🎉 ការបញ្ចុះតម្លៃពិសេសរហូតដល់ 30% សម្រាប់ការកុម្ម៉ង់ក្នុងសប្តាហ៍នេះ! | ដឹកជញ្ជូនឥតគិតថ្លៃសម្រាប់ការទិញចាប់ពី $50 ឡើងទៅ
    </div>

    <!-- Navigation Bar -->
    <header class="bg-white sticky top-0 z-40 shadow-sm border-b border-slate-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                
                <!-- Logo -->
                <div class="flex-shrink-0 flex items-center space-x-2">
                    <a href="index.html" class="flex items-center space-x-2">
                        <div class="w-10 h-10 rounded-xl bg-brand-600 text-white flex items-center justify-center text-xl font-bold shadow-md">
                            <i class="fa-solid fa-bag-shopping"></i>
                        </div>
                        <span class="text-xl font-bold bg-gradient-to-r from-brand-600 to-indigo-600 bg-clip-text text-transparent">
                            KHMER STORE
                        </span>
                    </a>
                </div>

                <!-- Desktop Navigation Links -->
                <nav class="hidden md:flex space-x-8 font-medium text-slate-600">
                    <a href="index.html" class="hover:text-brand-600 transition">ទំព័រដើម</a>
                    <a href="product.html" class="text-brand-600 font-semibold border-b-2 border-brand-600 pb-1">ផលិតផល</a>
                    <a href="discount.html" class="text-brand-600 font-semibold border-b-2 border-brand-600 pb-1">ការបញ្ចុះតម្លៃ</a>
                    <a href="about.html" class="hover:text-brand-600 transition">អំពីយើង</a>
                    <a href="contact.html" class="hover:text-brand-600 transition">ទំនាក់ទំនង</a>
                </nav>

                <!-- Search & Action Icons -->
                <div class="flex items-center space-x-4">
                    <!-- Search Input (Desktop) -->
                    <div class="relative hidden sm:block w-48 md:w-64">
                        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="ស្វែងរកផលិតផល..." 
                            class="w-full pl-9 pr-4 py-2 text-sm bg-slate-100 border-none rounded-full focus:ring-2 focus:ring-brand-500 focus:bg-white transition">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-sm"></i>
                    </div>

                    <!-- Cart Icon with Badge -->
                    <button onclick="toggleCartDrawer()" class="relative p-2 text-slate-600 hover:text-brand-600 transition rounded-full hover:bg-slate-100">
                        <i class="fa-solid fa-cart-shopping text-xl"></i>
                        <span id="cartBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">
                            0
                        </span>
                    </button>

                    <!-- User Account -->
                    <a href="#" class="p-2 text-slate-600 hover:text-brand-600 transition rounded-full hover:bg-slate-100 hidden sm:block" title="User account">
                        <i class="fa-regular fa-user text-xl"></i>
                    </a>

                    <!-- Mobile Menu Button -->
                    <button onclick="toggleMobileMenu()" class="md:hidden p-2 text-slate-600 hover:text-slate-900" title="Toggle mobile menu">
                        <i class="fa-solid fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Search Bar -->
        <div class="p-3 bg-slate-50 border-t border-slate-100 sm:hidden">
            <div class="relative">
                <input type="text" id="mobileSearchInput" onkeyup="syncMobileSearch()" placeholder="ស្វែងរកផលិតផល..." 
                    class="w-full pl-9 pr-4 py-2 text-sm bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-brand-500">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
            </div>
        </div>
    </header>

    <!-- Page Header Hero Banner -->
    <section class="bg-gradient-to-r from-slate-900 via-brand-900 to-slate-800 text-white py-12 px-4 relative overflow-hidden">
        <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#0ea5e9_1px,transparent_1px)] [background-size:16px_16px]"></div>
        <div class="max-w-7xl mx-auto text-center relative z-10">
            <h1 class="text-3xl md:text-5xl font-bold mb-3">អំពីយើង</h1>
            <p class="text-slate-300 max-w-2xl mx-auto text-sm md:text-base">
                ជ្រើសរើសផលិតផលដែលមានគុណភាពខ្ពស់ តម្លៃសមរម្យ និងមានការធានាត្រឹមត្រូវ។
            </p>
        </div>
    </section>
  
</body>
</html>
